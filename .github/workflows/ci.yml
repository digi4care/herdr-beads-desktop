name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run unit and regression tests
        run: npm test

  # `herdr-app check mods/beads-desktop` requires a Herdr Desktop
  # installation and cannot run on a hosted runner. Run it locally before
  # publishing: `npm run check:mod`.